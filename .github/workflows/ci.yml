name: Production checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Offline API and experiment regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile application
        run: python -m compileall -q main.py classification_ab.py ab_routing.py ab_metrics.py eval/report_ab.py
      - name: Audit pinned runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt --no-deps --disable-pip
      - name: Build deployment image
        run: docker build --tag neatmail:ci .
      - name: Verify image health check
        run: |
          docker image inspect neatmail:ci --format '{{json .Config.Healthcheck}}' | python -c "import json,sys; c=json.load(sys.stdin); assert c and c['Test'][0] == 'CMD-SHELL' and '/openapi.json' in c['Test'][1]"
          docker run --rm --entrypoint python neatmail:ci -m compileall -q main.py classification_ab.py ab_routing.py ab_metrics.py eval/report_ab.py
